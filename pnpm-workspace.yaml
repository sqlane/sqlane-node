# pnpm workspace: the published packages, and the test databases shared by their tests
packages:
  - packages/*
  - test

# `pnpm add` writes exact versions, not ^ ranges
saveExact: true

# Install scripts that are not needed: optional native speedups (ssh2, cpu-features), a version notice (protobufjs).
# All are dependencies of testcontainers.
allowBuilds:
  cpu-features: false
  protobufjs: false
  ssh2: false
