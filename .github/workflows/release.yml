# Release with Changesets (see docs/releasing.md)
# - Push to main with changesets: create or update the "Version Packages" pull request.
# - "Run workflow" after that pull request is merged: test, pack, then publish to npm (approval of the npm environment).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a release in progress

jobs:
  select-mode:
    name: Select mode
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: node pnpm
          cache: false # no caches in release jobs: cache poisoning
      - run: pnpm install --frozen-lockfile
      - id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Version Packages pull request
    if: github.event_name == 'push' && needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # commit the versions and the changelog
      pull-requests: write # create or update the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: node pnpm
          cache: false
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run changeset:version
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'

  nothing-to-publish:
    name: Nothing to publish
    if: github.event_name == 'workflow_dispatch' && needs.select-mode.outputs.mode != 'publish'
    needs: select-mode
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail
        env:
          MODE: ${{ needs.select-mode.outputs.mode }}
        run: |
          echo "::error::Nothing to publish (mode: $MODE). Merge the Version Packages pull request first."
          exit 1

  pack:
    name: Test and pack
    if: github.event_name == 'workflow_dispatch' && needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: node pnpm
          cache: false
      - run: pnpm install --frozen-lockfile
      - name: Tests (unit and integration)
        run: pnpm test
      - name: Package check
        run: pnpm lint:package
      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm # required reviewers: the job waits for an approval
    permissions:
      contents: write # git tags and GitHub releases
      id-token: write # npm trusted publishing (OIDC), with provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: node pnpm
          cache: false
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
