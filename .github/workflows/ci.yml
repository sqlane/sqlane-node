name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secrets scan reads the whole history
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - run: pnpm install --frozen-lockfile
      - name: Hook checks on all files
        run: hk check --all
      - name: Secrets in the git history
        run: betterleaks git --redact --no-banner .

  changeset:
    name: Changeset
    # The Version Packages pull request consumes the changesets: nothing to check there
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # compares with the base branch
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: node
      # Not `changeset status`: an update of devDependencies (Renovate) changes package.json, but nothing published
      - name: A change of the published files has a changeset
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check_changeset.js "origin/$BASE_REF"

  test:
    name: Tests (Node.js ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    env:
      MISE_NODE_VERSION: ${{ matrix.node }} # overrides the node version of mise.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit and integration tests (MySQL and PostgreSQL in testcontainers)
        run: pnpm test

  quickstart:
    name: Quickstart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash # -o pipefail: a failing demo fails the step, also through tee
        working-directory: examples/quickstart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: node pnpm
      - name: Pack @sqlane/core, as npm would publish it
        run: pnpm --dir ../.. pack --pack-destination "$RUNNER_TEMP"
      - name: Start the databases
        run: docker compose up --detach --wait
      - name: Install the quickstart, then put the packed @sqlane/core in place of the published one
        run: |
          npm ci --no-audit --no-fund
          rm -rf node_modules/@sqlane/core
          mkdir node_modules/@sqlane/core
          tar --extract --gzip --strip-components=1 --directory=node_modules/@sqlane/core \
            --file="$(echo "$RUNNER_TEMP"/sqlane-core-*.tgz)"
      - name: Run it on MySQL and PostgreSQL
        run: |
          for db in mysql postgres; do
            node "$db.js" | tee "$RUNNER_TEMP/$db.txt"
            grep --quiet --fixed-strings 'order 2: 0 rows in orders, 0 jobs' "$RUNNER_TEMP/$db.txt"
            grep --quiet --fixed-strings 'order 1: at most 1 sync at a time; order 3 ran alongside: yes' "$RUNNER_TEMP/$db.txt"
          done
