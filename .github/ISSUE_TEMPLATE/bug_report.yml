name: Bug report
description: Something does not work as the README or the design says
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest code that shows it. The quickstart (examples/quickstart) is a good start.
      render: js
    validations:
      required: true
  - type: input
    id: sqlane
    attributes:
      label: '@sqlane/core version'
      placeholder: 7.0.0
    validations:
      required: true
  - type: input
    id: database
    attributes:
      label: Database and version
      placeholder: MySQL 8.4.6, PostgreSQL 18.1
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: Driver or ORM, and its version
      placeholder: mysql2 3.24.6, Prisma 7.10.1
    validations:
      required: true
  - type: input
    id: adapter
    attributes:
      label: Adapter call
      placeholder: "mysql2Adapter(queuePool, { dialect: 'mysql' })"
  - type: input
    id: sql_mode
    attributes:
      label: sql_mode (MySQL and MariaDB)
      description: The result of `SELECT @@SESSION.sql_mode` on a connection of the queue's pool.
      placeholder: ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 24.11.0
  - type: textarea
    id: logs
    attributes:
      label: Errors, logs or events
      description: The error with its stack, and the `onEvent` events or logger output around it.
      render: text
