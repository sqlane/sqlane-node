<text x="0" y="22" font-size="18" font-weight="600" fill="#1f2328">Jobs per second, one worker</text>
<text x="0" y="46" font-size="14" fill="#59636e">PostgreSQL 17, 1 ms round trip, a backlog of 50,000 jobs of one name, 8 slots.</text>
<line x1="174.0" y1="64" x2="174.0" y2="392" stroke="#c3c2b7"/>
