<svg xmlns="http://www.w3.org/2000/svg" width="752" height="476" viewBox="0 0 752 476" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Time an enqueue adds to your transaction, median">
