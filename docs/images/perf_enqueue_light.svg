<svg xmlns="http://www.w3.org/2000/svg" width="752" height="476" viewBox="0 0 752 476" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Time an enqueue adds to your transaction, median">
<title>Time an enqueue adds to your transaction, median</title>
<rect width="752" height="476" rx="6" fill="#ffffff"/>
<g transform="translate(16 16)">
<text x="0" y="22" font-size="18" font-weight="600" fill="#1f2328">Time an enqueue adds to your transaction, median</text>
<text x="0" y="46" font-size="14" fill="#59636e">PostgreSQL 17, 1 ms round trip, steady load, one library at a time.</text>
